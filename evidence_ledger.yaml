# Evidence ledger for version 3 (draft). References that the organ-at-risk
# library and the refit rest on, each with a proof held outside the repository
# (external_proofs.yaml, gitignored). IDs follow the numbering of about.md;
# references 2-5, 7-9 and 11-16 (version 2 sources, see References/README.md)
# are not yet ledgered here. Numeric claims of about.md are not yet
# ledgered one by one: they are pinned by tests (test_v3_oar_schedule.R,
# test_v3_uncertainty.R) against data/ and draws/.
document: "about.md"
base_dir: "."
references_dir: "References"
claims:
  - id: quantec_parotid_20gy
    document_anchor: "Organs at risk (version 3)"
    rendered_claim: "parotid mean 20 Gy to one gland"
    source_kind: external_reference
    reference_ids: [19]
    support:
      - reference_id: 19
        locator: "Abstract"
        rationale: "Severe xerostomia usually avoided if at least one parotid gland is spared to a mean dose of less than about 20 Gy."
  - id: quantec_brainstem_54gy
    document_anchor: "Organs at risk (version 3)"
    rendered_claim: "brainstem 54 Gy"
    source_kind: external_reference
    reference_ids: [18]
    support:
      - reference_id: 18
        locator: "Abstract"
        rationale: "The entire brainstem may be treated to 54 Gy using conventional fractionation."
  - id: trial_data_7283
    document_anchor: "Parameter uncertainty (Bayesian refit, version 3)"
    rendered_claim: "35 arms"
    source_kind: external_reference
    reference_ids: [1]
    support:
      - reference_id: 1
        locator: "Table 1, p. 21"
        rationale: "35 trial arms from 16 publications, 7283 patients."
