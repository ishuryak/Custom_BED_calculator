# Test-only workflow for version 2. It never deploys.
# It restores the exact package versions of renv.lock (binaries from the same
# dated Posit Package Manager snapshot, Linux build) with the same script a
# user runs, then runs the suite in that library only.
name: tests

on:
  push:
    branches: [v2-toxicity-hypofractionation]
  pull_request:
  workflow_dispatch:

jobs:
  testthat:
    runs-on: ubuntu-24.04
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/2026-10-15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
      - name: Restore the locked package versions
        run: Rscript tools/restore_library.R
      - name: Run tests in the restored library
        run: Rscript tools/run_tests.R
